<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>SAP Fiori Launchpad - Defect Management System</title>

    <script id="sap-ushell-config">
        window["sap-ushell-config"] = {
            defaultRenderer: "fiori2",
            bootstrapPlugins: {
                "RuntimeAuthoringPlugin": {
                    "component": "sap.ushell.plugins.rta",
                    "config": {
                        "validateAppVersion": false
                    }
                }
            },
            renderers: {
                fiori2: {
                    componentData: {
                        config: {
                            enableSearch: true,
                            rootIntent: "Shell-home"
                        }
                    }
                }
            },
            services: {
                "NavTargetResolution": {
                    "config": {
                        "enableClientSideTargetResolution": true
                    }
                },
                "ClientSideTargetResolution": {
                    "adapter": {
                        "config": {
                            "inbounds": {
                                "Defect-manage": {
                                    "semanticObject": "Defect",
                                    "action": "manage",
                                    "title": "SAP Defect Management System",
                                    "subTitle": "All Defects & Management",
                                    "icon": "sap-icon://quality-issue",
                                    "resolutionResult": {
                                        "applicationType": "SAPUI5",
                                        "additionalInformation": "SAPUI5.Component=sap.defectmgmt",
                                        "url": "../"
                                    }
                                }
                            }
                        }
                    }
                }
            }
        };
    </script>

    <script src="https://ui5.sap.com/1.120.0/resources/sap-ui-core.js"
            id="sap-ui-bootstrap"
            data-sap-ui-theme="sap_horizon"
            data-sap-ui-resourceroots='{
                "sap.defectmgmt": "../"
            }'
            data-sap-ui-oninit="module:sap/ushell/bootstrap/sandbox"
            data-sap-ui-compatVersion="edge"
            data-sap-ui-async="true"
            data-sap-ui-frameOptions="allow">
    </script>

    <script>
        sap.ui.getCore().attachInit(function() {
            sap.ui.require([
                "sap/ushell/Container"
            ], function() {
                sap.ushell.Container.createRenderer().placeAt("content");
            });
        });
    </script>
</head>
<body class="sapUiBody" id="content">
</body>
</html>
