<!DOCTYPE html>
<html style="height: 100%;">
<head>
    <meta charset="utf-8">
    <title>SAP Defect Management</title>
    <script id="sap-ui-bootstrap"
        src="https://ui5.sap.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resourceroots='{"sap.defectmgmt": "./"}'
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-frameOptions="trusted"
        data-sap-ui-libs="sap.m, sap.ui.core, sap.f, sap.suite.ui.microchart"> </script>
    <script>
        sap.ui.getCore().attachInit(function() {
            sap.ui.require(["sap/ui/core/ComponentContainer"], function(ComponentContainer) {
                new ComponentContainer({
                    name: "sap.defectmgmt",
                    settings : {
                        id : "defectmgmt"
                    },
                    async: true
                }).placeAt("content");
            });
        });
    </script>
</head>
<body class="sapUiBody" id="content" style="height: 100%; margin: 0;">
</body>
</html>
