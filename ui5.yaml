specVersion: "3.0"
type: application
metadata:
  name: sap.defectmgmt

# --- BỔ SUNG KHỐI NÀY ĐỂ KÉO THƯ VIỆN BIỂU ĐỒ XỊN VỀ MÁY ---
framework:
  name: SAPUI5
  version: "1.120.0" # Hoặc "latest"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.f
    - name: sap.ui.layout
    - name: themelib_sap_horizon
    - name: sap.suite.ui.microchart
# -----------------------------------------------------------

server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        transpileTypeScript: true
        debug: true
        transformModulesToUI5:
          autoConvertAllExtendClasses: true
    # --- ĐÃ THÊM: Cấu hình Proxy để lách luật CORS gọi API ---
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false # Nếu backend dùng HTTPS tự cấp, đổi thành true
        backend:
          - path: /sap
            url: http://localhost:8000 # THAY ĐỔI URL NÀY THÀNH ĐỊA CHỈ SERVER SAP THỰC TẾ CỦA NHÓM BẠN
            client: "100" # Tùy chọn: Nhập Client ID của hệ thống SAP nếu cần
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        transpileTypeScript: true
        transformModulesToUI5:
          autoConvertAllExtendClasses: true