specVersion: "3.0"
type: application
metadata:
  name: sap.defectmgmt

# --- BỔ SUNG KHỐI NÀY ĐỂ KÉO THƯ VIỆN BIỂU ĐỒ XỊN VỀ MÁY ---
framework:
  name: SAPUI5
  version: "1.120.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.f
    - name: sap.ui.layout
    - name: themelib_sap_horizon
    - name: sap.suite.ui.microchart
# -----------------------------------------------------------

server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        transpileTypeScript: true
        debug: true
        transformModulesToUI5:
          autoConvertAllExtendClasses: true

    # --- ĐÃ SỬA PROXY ---
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: true
        backend:
          - path: /sap
            url: https://s40lp1.ucc.cit.tum.de
            client: "324"
# ----------------------

builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        transpileTypeScript: true
        transformModulesToUI5:
          autoConvertAllExtendClasses: true