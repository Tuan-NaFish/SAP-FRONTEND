specVersion: "3.0"
type: application
metadata:
  name: sap.defectmgmt

# --- BỔ SUNG KHỐI NÀY ĐỂ KÉO THƯ VIỆN BIỂU ĐỒ XỊN VỀ MÁY ---
framework:
  name: SAPUI5
  version: "1.120.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.f
    - name: sap.ui.layout
    - name: themelib_sap_horizon
    - name: sap.suite.ui.microchart
# -----------------------------------------------------------

server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        transpileTypeScript: true
        debug: true
        transformModulesToUI5:
          autoConvertAllExtendClasses: true

    # --- OData V4 Mock Middleware ---
    # Serves local mock data from webapp/localService/mockdata/*.json
    # as OData V4-compliant responses. Replaces the legacy client-side
    # sap.ui.core.util.MockServer (V2-only).
    #
    # Mounted to the exact service prefix so it intercepts ALL requests
    # under /sap/opu/odata4/... BEFORE serveResources can handle them.
    # For connecting to a live SAP backend, remove this block and
    # add back @sap/ux-ui5-tooling with fiori-tools-proxy configuration.
    - name: ui5-middleware-mockserver
      afterMiddleware: compression
      mountPath: /

    # --- Proxy to real SAP backend ---
    # Forwards all /sap requests to the UCC SAP training system.
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /sap
      configuration:
        baseUri: "https://s40lp1.ucc.cit.tum.de/sap"
        strictSSL: false

# ----------------------

builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        transpileTypeScript: true
        transformModulesToUI5:
          autoConvertAllExtendClasses: true