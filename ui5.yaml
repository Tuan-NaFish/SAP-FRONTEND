specVersion: "3.0"
type: application
metadata:
  name: sap.defectmgmt

# --- BỔ SUNG KHỐI NÀY ĐỂ KÉO THƯ VIỆN BIỂU ĐỒ XỊN VỀ MÁY ---
framework:
  name: SAPUI5
  version: "1.120.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.f
    - name: sap.ui.layout
    - name: themelib_sap_horizon
    - name: sap.suite.ui.microchart
# -----------------------------------------------------------

server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        transpileTypeScript: true
        debug: true
        transformModulesToUI5:
          autoConvertAllExtendClasses: true

    # --- Auth-check proxy (no browser Basic Auth popup) ---
    # FE Login form calls GET /auth-check with Authorization header.
    # This middleware validates against the real SAP backend and returns
    # 200/401 WITHOUT a WWW-Authenticate header, so the browser never
    # shows its native "Please Sign In" popup.
    - name: ui5-middleware-auth-check
      afterMiddleware: compression
      mountPath: /auth-check

    # --- OData V4 Mock Middleware (LOCAL DEV ONLY) ---
    # Serves local mock data so the app works offline without a live BE.
    # Comment this block out when connecting to the real SAP backend.
    # - name: ui5-middleware-mockserver
    #   afterMiddleware: compression
    #   mountPath: /sap/opu/odata4/sap/zui_issue_srvbind

    # --- Proxy to real SAP backend ---
    # Forwards all /sap requests to the UCC SAP training system.
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /sap
      configuration:
        baseUri: "https://s40lp1.ucc.cit.tum.de/sap"
        strictSSL: false

# ----------------------

builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        transpileTypeScript: true
        transformModulesToUI5:
          autoConvertAllExtendClasses: true